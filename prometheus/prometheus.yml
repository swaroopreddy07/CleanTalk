global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets:
          - 'backend-1:5000'
          - 'backend-2:5000'
          - 'backend-3:5000'
    metrics_path: /api/metrics
    scrape_interval: 10s

  - job_name: 'ai-service'
    static_configs:
      - targets:
          - 'ai-service:8000'
    metrics_path: /metrics
    scrape_interval: 30s
