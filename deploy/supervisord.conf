[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# ─── MySQL ──────────────────────────────────────────────────
[program:mysql]
command=mysqld --user=mysql --datadir=/var/lib/mysql
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── Redis ──────────────────────────────────────────────────
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── Node.js Backend ────────────────────────────────────────
[program:backend]
command=node /app/server/server.js
directory=/app/server
environment=PORT="5000",DB_HOST="localhost",DB_USER="root",DB_PASSWORD="%(ENV_DB_PASSWORD)s",DB_NAME="%(ENV_DB_NAME)s",REDIS_HOST="localhost",REDIS_PORT="6379",AI_SERVICE_URL="http://localhost:8000",JWT_SECRET="%(ENV_JWT_SECRET)s",JWT_EXPIRE="7d",CLIENT_URL="*",NODE_ENV="production",INSTANCE_ID="backend-1",QUEUE_NAME="content-moderation",BACKEND_URL="http://localhost:5000",EMAIL_USER="%(ENV_EMAIL_USER)s",EMAIL_PASS="%(ENV_EMAIL_PASS)s"
autostart=true
autorestart=true
priority=30
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── FastAPI AI Service ──────────────────────────────────────
[program:ai-service]
command=python3 -m uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app/ai-service
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=40
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── AI Worker (BullMQ consumer) ─────────────────────────────
[program:ai-worker]
command=python3 worker.py
directory=/app/ai-service
environment=PYTHONUNBUFFERED="1",REDIS_HOST="localhost",REDIS_PORT="6379",DB_HOST="localhost",DB_USER="root",DB_PASSWORD="%(ENV_DB_PASSWORD)s",DB_NAME="%(ENV_DB_NAME)s",WORKER_ID="worker-1",QUEUE_NAME="content-moderation"
autostart=true
autorestart=true
priority=50
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── Nginx (reverse proxy + static files) ────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=60
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
