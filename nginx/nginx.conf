# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Upstream backend pool (round-robin)
upstream backend_pool {
    server backend-1:5000;
    server backend-2:5000;
    server backend-3:5000;
}

# Upstream for Socket.IO (sticky sessions via ip_hash)
upstream backend_ws {
    ip_hash;
    server backend-1:5000;
    server backend-2:5000;
    server backend-3:5000;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# Logging
log_format custom '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rt=$request_time ust=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log warn;

    # Max upload size (for images)
    client_max_body_size 10M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API Routes ──────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
    }

    # ── Auth Routes (stricter rate limit) ───────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
    }

    # ── Socket.IO WebSocket ─────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        
        # Longer timeouts for WebSocket
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Azure blob proxy ────────────────────────────────
    location /azure-image/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_cache_bypass 1;
    }

    # ── Static uploads ──────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_cache_bypass 1;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Prometheus metrics ──────────────────────────────
    location /metrics {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
    }

    # ── Frontend (React app) ────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
    }

    # ── Health check ────────────────────────────────────
    location /nginx-health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # ── Error pages ─────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
